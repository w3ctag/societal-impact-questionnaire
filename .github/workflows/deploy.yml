name: deploy

on:
  pull_request: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: w3c/spec-prod@v2
      with:
        BUILD_FAIL_ON: warning
        GH_PAGES_BRANCH: gh-pages
        W3C_BUILD_OVERRIDE: |
          specStatus: NOTE
        W3C_ECHIDNA_TOKEN: ${{ secrets.ECHIDNA_TOKEN }}
        W3C_WG_DECISION_URL: https://github.com/w3ctag/meetings/blob/gh-pages/2026/telcons/10-12-minutes.md#societal-impact-questionnaire45-publish-this-document-as-note-before-tpac-2026---csarven-lolaodelola
